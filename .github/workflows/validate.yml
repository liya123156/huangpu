name: Validate and package dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - name: Run synthetic regression tests
        run: |
          node tests/core.test.cjs
          node tests/xlsx-blank.test.cjs
          node tests/organization.test.cjs
          node tests/data-management.test.cjs
          node tests/leaderboard.test.cjs
          node tests/xlsx-large.test.cjs
          node tests/weekly-model.test.cjs
          node tests/weekly-reload.test.cjs
          node tests/weekly-import.test.cjs
          node tests/performance-import.test.cjs
      - name: Package static app (code only)
        uses: actions/upload-artifact@v4
        with:
          name: huangpu-static-app
          include-hidden-files: true
          retention-days: 7
          path: |
            index.html
            assets/
            README.md
            netlify.toml
            .nojekyll
            tests/
      - name: Report hosting readiness separately from code validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENABLED=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          if [ "$ENABLED" = "true" ]; then
            echo 'GitHub Pages is enabled; check its own deployment status before sharing the site.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Code validation passed. Hosting is NOT enabled; this is not a successful deployment.' >> "$GITHUB_STEP_SUMMARY"
            echo "One-time setting: https://github.com/$GITHUB_REPOSITORY/settings/pages -> Deploy from a branch -> main -> / (root) -> Save." >> "$GITHUB_STEP_SUMMARY"
          fi
